spring.application.name=SimpleSplit

# Database Configuration
# Defaulting to H2 for easy setup and testing.
# To use MySQL, uncomment the MySQL lines and comment out H2 lines.

# --- H2 Configuration ---
spring.datasource.url=jdbc:h2:mem:simplesplit;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- MySQL Configuration (Uncomment to use) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/simplesplit?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
